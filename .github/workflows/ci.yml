name: ci

# lint (Biome) / typecheck / test を並列ジョブで実行する。
# pull_request は PR のマージ結果に対して走るため main も守られる。

on:
  pull_request:

# 最小権限: チェックアウトしたソースの読み取りのみ。
permissions:
  contents: read

# 同一 ref 上の古い実行はキャンセルして実行を整理する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome (lint + format + import order)
        run: pnpm exec biome ci

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck # tsc --noEmit

  bundle:
    name: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Bundle
        run: pnpm --filter @kukv/koto-mcp run bundle
      - name: Smoke test
        run: pnpm --filter @kukv/koto-mcp run smoke

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start database (PGroonga + pgvector)
        run: docker compose up -d --build
      - name: Wait for database
        # -h localhost で TCP を指定するのが要点。postgres の entrypoint は初期化スクリプトを
        # 走らせる間、listen_addresses='' の一時サーバで動くため、Unix ソケット経由の
        # pg_isready は初期化中でも成功してしまう。一方 docker は公開ポートを先に受け付けるので、
        # 中でまだ TCP を待ち受けていない間に host から繋ぐと接続直後に切られ、テストが
        # 「Connection terminated unexpectedly」で落ちる。TCP で待てばこの窓が閉じる。
        run: |
          for _ in $(seq 1 60); do
            docker compose exec -T db pg_isready -U koto -d koto -h localhost && exit 0
            sleep 2
          done
          echo "database not ready" >&2
          docker compose logs db
          exit 1
      - name: Test
        run: pnpm test # vitest run(koto_test を作り直して単体+DB統合を検証)

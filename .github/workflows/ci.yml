name: ci

# lint (Biome) / typecheck / test を並列ジョブで実行する。
# pull_request は PR のマージ結果に対して走るため main も守られる。

on:
  pull_request:

# 最小権限: チェックアウトしたソースの読み取りのみ。
permissions:
  contents: read

# 同一 ref 上の古い実行はキャンセルして実行を整理する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome (lint + format + import order)
        run: pnpm exec biome ci

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck # tsc --noEmit

  bundle:
    name: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Bundle
        run: pnpm --filter @kukv/koto-mcp run bundle
      - name: Smoke test
        run: pnpm --filter @kukv/koto-mcp run smoke

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン攻撃の検知に向けた計測(analyze モード)。
      # syscall を capture して falco-analyze ジョブで通信先・プロセスを可視化する。
      # 検知しても fail させない。
      - name: Start Falco
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze
          # sysdig 0.41.4 (renovate は digest 単体を追従できないため手動更新)
          sysdig-version: sha256:740a122ba3ab923467c09a25725cdc5b530d93345f00cc1ced1b4a32bd9c52a9
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start database (PGroonga + pgvector)
        run: docker compose up -d --build
      - name: Wait for database
        # -h localhost で TCP を指定するのが要点。postgres の entrypoint は初期化スクリプトを
        # 走らせる間、listen_addresses='' の一時サーバで動くため、Unix ソケット経由の
        # pg_isready は初期化中でも成功してしまう。一方 docker は公開ポートを先に受け付けるので、
        # 中でまだ TCP を待ち受けていない間に host から繋ぐと接続直後に切られ、テストが
        # 「Connection terminated unexpectedly」で落ちる。TCP で待てばこの窓が閉じる。
        run: |
          for _ in $(seq 1 60); do
            docker compose exec -T db pg_isready -U koto -d koto -h localhost && exit 0
            sleep 2
          done
          echo "database not ready" >&2
          docker compose logs db
          exit 1
      - name: Test
        run: pnpm test # vitest run(koto_test を作り直して単体+DB統合を検証)
      - name: Stop Falco
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          mode: analyze

  # capture を解析して、ジョブ中の通信先 / DNS / プロセスをジョブサマリに出す。
  # 収集が目的のため、検知があっても fail させない。
  falco-analyze:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 計測が目的のジョブなので、capture が無い等で失敗しても CI をブロックしない
    continue-on-error: true
    permissions:
      contents: read
      actions: read

    steps:
      - name: Analyze
        uses: falcosecurity/falco-actions/analyze@558a3ceeee9403e1c875ffbeb704c34c93e24752 # main(タグ未発行のため commit を固定)
        with:
          # falco 0.39.2 (renovate は digest 単体を追従できないため手動更新)
          falco-version: sha256:ba05dfb209cc1c2e912ce116d230b5f59c4542e7286f05b663c499066d5d6a42
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

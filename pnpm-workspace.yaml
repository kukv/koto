packages:
  - packages/*

# --- サプライチェーン強化 (bright-room/repository-fanout の設定に準拠) ---
# 公開から 7 日 (10080 分) 未満のバージョンは推移的依存も含めインストールしない
minimumReleaseAge: 10080
# パッケージの信頼レベル (provenance) が前回より下がったらインストールを止める
trustPolicy: no-downgrade
# 未承認のビルドスクリプトを持つ依存があれば install を非ゼロ終了で失敗させる
strictDepBuilds: true
# 推移的依存が git / tarball URL 等の exotic source を使うのを禁止（直接依存のみ可）
blockExoticSubdeps: true
# peer 依存の欠落・不整合があれば install を失敗させる
strictPeerDependencies: true

# vitest が依存する esbuild はネイティブバイナリの取得に postinstall が必要
allowBuilds:
  esbuild: true

# 脆弱性修正版を推移的依存に強制する。
# `pnpm update <名前>` は推移的依存にしか現れないパッケージには効かないため、
# 直接依存を持たないものはここで固定する。修正が上流(postcss / vite / vitest)に
# 取り込まれて不要になったら削除すること。
overrides:
  # GHSA-2v37-7h3g-55p8 (CVSS 8.2)。postcss → nanoid 3.3.16 が該当し、3.3.17 で修正済み
  nanoid@3: ^3.3.17
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

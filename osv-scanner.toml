# security.yml の sca ジョブ(osv-scanner)が自動適用する設定。
#
# 現在、除外している脆弱性は無い。
#
# 一時除外を入れるのは、修正版が公開されているのに pnpm-workspace.yaml の
# minimumReleaseAge (7日) でまだインストールできない場合に限る。その場合は
# ignoreUntil を必ず付け、解禁後に lockfile を更新して記載を削除すること。
#
# 修正版がインストールできるのに推移的依存で上がらない場合は、ここで除外せず
# pnpm-workspace.yaml の overrides で固定する(`pnpm update <名前>` は推移的
# 依存にしか現れないパッケージには効かないため)。
#
# 書式:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-01-01
# reason = "<パッケージ> <バージョン> で修正済み。minimumReleaseAge の解禁待ち"
